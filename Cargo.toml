[package]
name = "lclip"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
ksni = { version = "0.3.6", features = ["blocking"] }
rustix = { version = "1.1.5", features = ["event"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.14.0", features = ["xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
global-hotkey = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSURL"] }
tray-icon = "0.26"
# Same winit eframe uses, only to keep the window out of the Dock.
winit = { version = "0.30", default-features = false }
